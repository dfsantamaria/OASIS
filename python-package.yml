# ============================================================
#  OASIS — Python Package CI/CD Workflow
#  Fixes applied:
#    1. Explicit least-privilege permissions (resolves alert #4)
#    2. Pinned python-version (resolves setup-ecosystem warning)
#    3. Updated dependency-submission action
#    4. Separated concerns: test, publish, security scanning
# ============================================================

name: Python Package using Conda

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]

# ------------------------------------------------------------------
# FIX 1: Top-level default permissions — deny everything by default,
#         then grant only what each job actually needs.
# ------------------------------------------------------------------
permissions:
  contents: read

jobs:

  # ================================================================
  #  JOB 1: Test
  # ================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read          # checkout
      checks: write           # publish test results

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # FIX 2: Explicit Python version — no more "whatever is in PATH"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          auto-update-conda: true
          activate-environment: oasis-env

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          conda install -c conda-forge \
            numpy=2.1.0 \
            pandas=2.2.2 \
            scikit-learn=1.5.1 \
            lightgbm=4.6.0 \
            pytest=8.3.2
          pip install --upgrade pip

      - name: Run pytest
        shell: bash -el {0}
        run: pytest --tb=short -v

  # ================================================================
  #  JOB 2: Dependency Snapshot Submission
  # ================================================================
  dependency-snapshot:
    name: Submit Dependency Snapshot
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: write         # required to submit dependency snapshot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-tools
        run: pip install pip-tools==7.5.3

      - name: Compile requirements
        run: pip-compile requirements.in -o requirements.txt

      # FIX 3: Updated action — Replace deprecated component-detection action
      - name: Submit dependency snapshot
        uses: actions/dependency-submission-action@v1

  # ================================================================
  #  JOB 3: CodeQL Security Scanning
  # ================================================================
  codeql:
    name: CodeQL Advanced
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    permissions:
      contents: read
      security-events: write  # required to upload CodeQL results
      actions: read           # required for private repos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended  # catches more issues than default

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  # ================================================================
  #  JOB 4: Publish to PyPI  (runs only on GitHub Release)
  # ================================================================
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, dependency-snapshot]
    if: github.event_name == 'release' && github.event.action == 'published'

    permissions:
      contents: read
      id-token: write         # required for trusted PyPI publishing (OIDC)

    environment:
      name: pypi
      url: https://pypi.org/project/oasis/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build
