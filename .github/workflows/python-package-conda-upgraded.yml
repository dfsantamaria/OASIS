# ============================================================
#  OASIS — Python Package CI/CD Workflow
#  Upgraded from baseline:
#    1. Scoped triggers — main branch + releases only
#    2. Explicit least-privilege permissions per job
#    3. Replaced manual $CONDA PATH hack with setup-miniconda@v3
#    4. Updated actions/setup-python to @v5
#    5. Moved flake8 + pytest into conda env install (no runtime conda install)
#    6. Added dependency snapshot, CodeQL, and PyPI publish jobs
# ============================================================

name: Python Package using Conda

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:

  # ================================================================
  #  JOB 1: Test
  # ================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          auto-update-conda: true
          activate-environment: oasis-env

      - name: Install dependencies
        shell: bash -el {0}
        run: conda env update --file environment.yml --name oasis-env

      - name: Lint with flake8
        shell: bash -el {0}
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run pytest
        shell: bash -el {0}
        run: pytest --tb=short -v

  # ================================================================
  #  JOB 2: Dependency Snapshot Submission
  # ================================================================
  dependency-snapshot:
    name: Submit Dependency Snapshot
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-tools
        run: pip install pip-tools==7.5.3

      - name: Compile requirements
        run: pip-compile requirements.in -o requirements.txt

      - name: Submit dependency snapshot
        uses: actions/component-detection-dependency-submission-action@v0.0.2
        with:
          scanType: "register"

  # ================================================================
  #  JOB 3: CodeQL Security Scanning
  # ================================================================
  codeql:
    name: CodeQL Advanced
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  # ================================================================
  #  JOB 4: Publish to PyPI  (runs only on GitHub Release)
  # ================================================================
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, dependency-snapshot]
    if: github.event_name == 'release' && github.event.action == 'published'

    permissions:
      contents: read
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/project/oasis/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
